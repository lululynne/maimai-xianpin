<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#DA291C">
  <title>麦麦现拼 · 手机模拟</title>
  <link rel="icon" href="/assets/theme/fries-game-icon.png">
  <link rel="stylesheet" href="/phone.css">
  <script src="/phone.js"></script>
</head>
<body>
  <div class="phone"><iframe id="screen" src="/" title="麦麦现拼手机界面"></iframe></div>
  <div class="side">
    <h1>麦麦<span>现拼</span> · 手机模拟</h1>
    <p>左边就是手机上看到的样子，可以直接点。</p>
    <ol>
      <li>点 <b>发起拼单</b>，选套餐和自己那份</li>
      <li>看 <b>相似拼单</b> 弹窗，点 <b>确认下单</b></li>
      <li>在小卡片里点 <b>演示：模拟拼友加入并确认</b></li>
      <li>点 <b>演示：模拟官方渠道已下单</b></li>
      <li>点 <b>已取到，提醒大家</b></li>
    </ol>
    <div class="btns"><button class="y" id="restart">重新开始</button><a class="r" href="/">全屏打开</a></div>
    <p class="note">演示模式：菜单是真实采集的快照，拼友、昵称和尾号都是虚构的。网页不收款、不代下单、不发券。手机宽度打开这页会直接进入正式界面。</p>
  </div>
</body>
</html>
